<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - FarmFresh Foods</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/account.css">
</head>
<body>
    <div id="site-nav"></div>

    <section class="account-section">
        <div class="container">
            <h2 class="fw-bold mb-1"><i class="fas fa-credit-card text-success me-2"></i>Checkout</h2>
            <p class="text-muted mb-4">Confirm your delivery details and place your order.</p>

            <div id="checkoutAlert" class="d-none"></div>

            <div class="row" id="checkoutRow">
                <div class="col-lg-7 mb-4">
                    <div class="card account-card">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Delivery Details</h5>
                            <form id="checkoutForm" novalidate>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="name" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="phone" required>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="address" class="form-label">Delivery Address *</label>
                                    <textarea class="form-control" id="address" rows="3" placeholder="Street, city, state, PIN code" required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="notes" class="form-label">Delivery Notes</label>
                                    <textarea class="form-control" id="notes" rows="2" placeholder="Optional instructions for the delivery partner"></textarea>
                                </div>

                                <h6 class="fw-bold mb-3 mt-4">Payment Method</h6>
                                <div class="payment-option selected" data-method="Cash on delivery">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="payment" id="payCod" value="Cash on delivery" checked>
                                        <label class="form-check-label fw-semibold" for="payCod">
                                            <i class="fas fa-money-bill-wave text-success me-2"></i>Cash on delivery
                                        </label>
                                    </div>
                                </div>
                                <div class="payment-option" data-method="Card on delivery">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="payment" id="payCard" value="Card on delivery">
                                        <label class="form-check-label fw-semibold" for="payCard">
                                            <i class="fas fa-credit-card text-success me-2"></i>Card on delivery
                                        </label>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success w-100 py-2 mt-3">
                                    <i class="fas fa-check-circle me-2"></i>Place Order
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card account-card">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3">Order Summary</h5>
                            <div id="summaryItems"></div>
                            <div class="summary-row total">
                                <span>Total</span>
                                <span class="text-success">₹<span id="summaryTotal">0.00</span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Success confirmation -->
    <div class="modal fade" id="successModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center">
                <div class="modal-body p-5">
                    <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
                    <h3 class="fw-bold mt-3 mb-2">Order Placed!</h3>
                    <p class="text-muted">Your order <strong id="successOrderId"></strong> has been confirmed.</p>
                    <div class="d-grid gap-2 mt-4">
                        <a href="orders.html" class="btn btn-success">
                            <i class="fas fa-receipt me-2"></i>View Order History
                        </a>
                        <a href="../index.html" class="btn btn-outline-success">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/checkout.js"></script>
</body>
</html>
