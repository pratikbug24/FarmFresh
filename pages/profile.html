<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - FarmFresh Foods</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/account.css">
</head>
<body>
    <div id="site-nav"></div>

    <section class="account-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card account-card text-center p-4">
                        <div class="card-body">
                            <div class="profile-avatar" id="avatarInitials">FF</div>
                            <h4 class="fw-bold mb-1" id="profileName">—</h4>
                            <p class="text-muted mb-3">@<span id="profileUsername">—</span></p>
                            <span class="badge bg-success-subtle text-success-emphasis status-badge">
                                <i class="fas fa-check-circle me-1"></i>Active member
                            </span>
                            <hr class="my-4">
                            <div class="d-grid gap-2">
                                <a href="orders.html" class="btn btn-outline-success">
                                    <i class="fas fa-receipt me-2"></i>Order History
                                </a>
                                <a href="../index.html" class="btn btn-outline-secondary">
                                    <i class="fas fa-store me-2"></i>Continue Shopping
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card account-card">
                        <div class="card-body p-4">
                            <h4 class="fw-bold mb-4"><i class="fas fa-id-card text-success me-2"></i>Account Details</h4>

                            <div id="profileAlert" class="d-none"></div>

                            <form id="profileForm" novalidate>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="name" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" required>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="phone">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="username" disabled>
                                        <div class="form-text">Usernames cannot be changed.</div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="address" class="form-label">Default Delivery Address</label>
                                    <textarea class="form-control" id="address" rows="3" placeholder="Street, city, state, PIN code"></textarea>
                                </div>

                                <hr class="my-4">
                                <h6 class="fw-bold mb-3"><i class="fas fa-key text-success me-2"></i>Change Password</h6>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="newPassword" class="form-label">New Password</label>
                                        <input type="password" class="form-control" id="newPassword" autocomplete="new-password" placeholder="Leave blank to keep current">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="confirmPassword" class="form-label">Confirm New Password</label>
                                        <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password">
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-success">
                                        <i class="fas fa-save me-2"></i>Save Changes
                                    </button>
                                    <button type="reset" class="btn btn-outline-secondary">Reset</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/profile.js"></script>
</body>
</html>
